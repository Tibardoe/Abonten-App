name: Integration tests

# Runs the local-Supabase concurrency/idempotency/authz suite
# (packages/services/src/__integration__/**) against a real, disposable
# Postgres started via the Supabase CLI -- see scripts/test-db/
# setup-local-test-db.mjs and docs/audit/01-limitations-register.md
# ("Migration replay ordering bug" / TEST-001 / SEC-001) for why this
# exists and what it does and does not cover.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js's createClient() always constructs a
          # Realtime client, which requires the native global WebSocket --
          # only available from Node 22 onward. Node 20 throws
          # "Node.js detected but native WebSocket not found" the instant
          # setupClient.ts calls createClient(), before any test runs.
          node-version: "22"
          cache: npm

      - run: npm ci

      # Pinned to match the version this suite was authored and verified
      # against locally -- bump deliberately, not silently, if the local
      # dev version moves.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - run: npm run test:db:up

      - run: npm run test:integration

      # Always tear down (stops the Docker containers, deletes the
      # disposable workdir) even if the tests above failed.
      - if: always()
        run: npm run test:db:down
