name: Typecheck, lint & build

# Typecheck and lint need no secrets. The two build jobs below do -- they
# run `next build` for apps/web and apps/admin with repo secrets for the
# third-party services (added 2026-09-05). No job uses the production
# Supabase project: web's e2e job has its own local stack, admin's build
# needs no database. Split into separate jobs (rather than one `turbo run
# build` job) because web and admin are different Sentry projects with
# different DSNs, so NEXT_PUBLIC_SENTRY_DSN needs a different secret mapped
# in per app -- one job's env block can't hold two values for that name.
# apps/mobile and packages/* have no "build" script, so they're untouched
# by any of this (confirmed: turbo/npm workspace `build` skips workspaces
# without the script).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run lint:ci

  # Unit tests (pure functions in packages/core + packages/services) and the
  # mobile API parity guard need no secrets either. Added 2026-09-11 with the
  # Field Ops module: neither was in CI before, so a broken pure helper or a
  # /api/mobile route without its @abonten/api-client twin only surfaced when
  # someone ran them by hand.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npx vitest run
        working-directory: packages/core

      - run: npm run test -w @abonten/services

      - run: npm run check:api-parity

      - run: npm run check:mobile-a11y

      - run: npm run check:deep-link-decoder

      - run: npm run check:i18n

  # Documentation validation (docs/** and the public legal/help content):
  # required files, metadata, internal links, code references, placeholder
  # and social links, secret patterns, public/internal separation. No
  # secrets, no network (external links are an opt-in local run).
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm run check:docs

  # Builds the web app and runs the Playwright suite (apps/web/e2e) against
  # `next start`: pages, headers, redirects, 404s, SEO tags and an axe
  # accessibility scan of the public surface. One job rather than a build
  # job plus a test job so the build is done once.
  #
  # The database is the job's own: a local Supabase stack replayed from
  # supabase/migrations/ (the integration suite's setup script) and seeded
  # with one event and one place, so the listing-page checks have something
  # to open and fail if they cannot. Until 2026-09-27 this job used the
  # production project with the legacy anon key disabled on 2026-09-04:
  # every data read was refused, the listing checks skipped themselves, and
  # the job stayed green. CI never touches the production database.
  build-and-e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_REQUIRE_CATALOGUE: "1"
      OBSERVABILITY_INGEST_SECRET: ${{ secrets.OBSERVABILITY_INGEST_SECRET }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.WEB_SENTRY_DSN }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      HUBTEL_API_CLIENT_ID: ${{ secrets.HUBTEL_API_CLIENT_ID }}
      HUBTEL_API_CLIENT_SECRET: ${{ secrets.HUBTEL_API_CLIENT_SECRET }}
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}
      PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
      PAYSTACK_WEBHOOK_SECRET: ${{ secrets.PAYSTACK_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Same pin as integration-tests.yml.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      - run: npm run test:db:up

      - run: node scripts/test-db/seed-e2e.mjs

      # The local stack's URL and keys (fixed, public development values
      # printed by `supabase status`) become the build's Supabase config.
      - name: Point the build at the local stack
        run: |
          set -a; . ./.env.test.local; set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_TEST_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_TEST_ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_TEST_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - run: npx playwright install --with-deps chromium

      - run: npm run build -w @abonten/web

      - run: npx playwright test
        working-directory: apps/web
        env:
          CI: "true"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

      - if: always()
        run: npm run test:db:down

  # The console makes no database call at build time (every page is
  # dynamic), so the build gets obviously fake Supabase values instead of
  # production credentials.
  build-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-has-no-database
      SUPABASE_SERVICE_ROLE_KEY: ci-build-has-no-database
      OBSERVABILITY_INGEST_SECRET: ${{ secrets.OBSERVABILITY_INGEST_SECRET }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.ADMIN_SENTRY_DSN }}
      ADMIN_EMAIL_ALLOWLIST: ${{ secrets.ADMIN_EMAIL_ALLOWLIST }}
      NEXT_PUBLIC_ADMIN_URL: ${{ secrets.NEXT_PUBLIC_ADMIN_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build -w @abonten/admin
